<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Leads | Ria Artisan</title><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">R</span><span><strong>Admin Leads</strong><small>Artisan King George</small></span></a><nav class="nav open" style="position:static;display:flex;background:transparent;border:0;box-shadow:none"><a href="/">Website</a></nav></header><main class="section"><div class="glass contact-card"><p class="eyebrow">Secure demo view</p><h1 style="font-size:46px">Customer Requests</h1><p>Enter admin token to view saved website leads.</p><div class="planner"><input id="token" placeholder="Admin token, example demo123"><button class="btn primary" id="load">Load leads</button><p id="status" class="form-msg"></p></div><div id="leads" class="faq-list"></div></div></main><script>const $=(s)=>document.querySelector(s);$('#load').onclick=async()=>{const token=$('#token').value.trim();$('#status').textContent='Loading...';try{const r=await fetch('/api/admin/leads?token='+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw new Error(d.error||'Unauthorized');$('#status').textContent=`${d.count} lead(s) found.`;$('#leads').innerHTML=d.leads.map(l=>`<article class="faq-item open"><button>${l.name||'No name'}<span>${new Date(l.createdAt).toLocaleString()}</span></button><p><b>Phone:</b> ${l.phone||'-'}<br><b>Email:</b> ${l.email||'-'}<br><b>Destination:</b> ${l.destination||'-'}<br><b>Method:</b> ${l.method||'-'}<br><b>Amount:</b> ${l.amount||'-'}<br><b>Message:</b> ${l.message||'-'}</p></article>`).join('')||'<p>No leads yet.</p>'}catch(e){$('#status').textContent='⚠️ '+e.message}};</script></body></html>
